# Example: a classic full-CRUD blog
#
# What this demonstrates:
#   - A model with typed columns and a nullable timestamp
#   - A full resource controller (index/create/store/show/edit/update/destroy)
#   - Controller statements: query, render, validate, save, find, delete, redirect
#
# Generate it with:
#   php artisan blueprint:build examples/01-blog-crud.yaml
#
# This produces: a Post model + migration + factory, a PostController with
# all seven resource actions, routes, PostStoreRequest and PostUpdateRequest
# form requests, and feature tests for each action.

models:
  Post:
    title: string:400
    content: longtext
    published_at: nullable timestamp

controllers:
  Post:
    index:
      query: all
      render: posts.index with:posts

    create:
      render: posts.create with:post

    store:
      validate: title, content
      save: post
      redirect: posts.index

    show:
      find: post.id
      render: posts.show with:post

    edit:
      find: post.id
      render: posts.edit with:post

    update:
      validate: title, content
      find: post.id
      save: post
      redirect: posts.index

    destroy:
      find: post.id
      delete: post
