# Example: a blog
#
# The classic starting point: posts that can be listed, created, viewed,
# edited and deleted through a standard Laravel resource controller.
#
# Build it with:
#   php artisan blueprint:build examples/01-blog-crud.yaml
#
# You get: a Post model, migration and factory; a PostController with all
# seven resource actions; routes; PostStoreRequest and PostUpdateRequest
# form requests; and a feature test for each action.

models:
  Post:
    title: string:400
    content: longtext
    published_at: nullable timestamp

controllers:
  Post:
    index:
      query: all
      render: posts.index with:posts

    create:
      render: posts.create with:post

    store:
      validate: title, content
      save: post
      redirect: posts.index

    show:
      find: post.id
      render: posts.show with:post

    edit:
      find: post.id
      render: posts.edit with:post

    update:
      validate: title, content
      find: post.id
      save: post
      redirect: posts.index

    destroy:
      find: post.id
      delete: post
