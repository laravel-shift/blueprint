# Example: the relationship shapes you'll reach for most often
#
# What this demonstrates, across three small, independent model sets:
#   1. Subscription (related to Team/Order/Duration/Transaction, which are
#      assumed to exist elsewhere in your app and are not generated here)
#      -> belongsTo (via a foreign id column), belongsToMany, hasMany,
#         and hasOne (comma-separated: one line can declare several
#         relationships of the same type)
#   2. Post/User/Image
#      -> polymorphic relationships: morphMany and morphTo
#   3. Author/Book
#      -> a plain one-to-many belongsTo/hasMany pair, for contrast with
#         the polymorphic version above
#
# Generate it with:
#   php artisan blueprint:build examples/03-relationships.yaml
#
# Tip: `user_id: id` and `product_id: uuid` are both shorthand for a
# belongsTo foreign key column -- Blueprint infers the related model
# (User, Product) from the column name, so you don't have to declare
# `relationships: { belongsTo: User }` separately for those.

models:
  Subscription:
    user_id: id
    product_id: uuid
    relationships:
      belongsToMany: Team
      hasMany: Order
      hasOne: Duration, Transaction

  Post:
    name: string:400
    relationships:
      morphMany: Image

  User:
    name: string:400
    relationships:
      morphMany: Image

  Image:
    url: string:400
    relationships:
      morphTo: Imageable

  Author:
    name: string:400
    relationships:
      hasMany: Book

  Book:
    title: string:400
    author_id: id
