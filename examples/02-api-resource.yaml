# Example: a JSON API with a parent/child relationship
#
# What this demonstrates:
#   - `relationships:` to declare hasMany / belongsTo between two models
#   - `resource: api` shorthand, which generates only the five JSON-friendly
#     actions (index/store/show/update/destroy, no create/edit views)
#
# Generate it with:
#   php artisan blueprint:build examples/02-api-resource.yaml
#
# This produces: Order and Item models + migrations + factories, an
# Api/OrderController (api resource) with form requests and resource classes,
# and an apiResource route registered in routes/api.php.

models:
  Order:
    reference: string
    relationships:
      hasMany: Item

  Item:
    product_id: id
    quantity: unsignedInteger
    relationships:
      belongsTo: Order

controllers:
  Api/Order:
    resource: api
